<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منوشه ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#000;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* القلوب النازلة */

.matrix{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:0;
pointer-events:none;
}

.line{
position:absolute;
top:-100px;
color:#ff2d75;
font-size:10px;
font-weight:bold;
white-space:nowrap;
opacity:.8;
animation:fall linear forwards;
text-shadow:0 0 5px #ff2d75;
}

@keyframes fall{

0%{
transform:translateY(-100px);
opacity:0;
}

10%{
opacity:1;
}

100%{
transform:translateY(120vh);
opacity:0;
}

}

/* الكلام */

.text{
position:relative;
z-index:2;
font-size:55px;
font-weight:900;
color:white;
text-align:center;

text-shadow:
0 0 10px #ff2d75,
0 0 20px #ff2d75,
0 0 40px #ff2d75;

opacity:0;
transform:scale(.5);

transition:1s;
padding:20px;
}

.show{
opacity:1;
transform:scale(1);
}

.hide{
opacity:0;
transform:scale(1.5);
}

</style>
</head>

<body>

<!-- خلفية القلوب -->

<div class="matrix" id="matrix"></div>

<!-- الكلام -->

<div class="text" id="text"></div>

<script>

/* القلوب الصغيرة */

const matrix =
document.getElementById("matrix");

function createLine(){

const line =
document.createElement("div");

line.className = "line";

line.innerHTML =
"❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️";

line.style.left =
Math.random()*100 + "vw";

line.style.animationDuration =
(Math.random()*3 + 3) + "s";

line.style.fontSize =
(Math.random()*6 + 8) + "px";

matrix.appendChild(line);

setTimeout(()=>{

line.remove();

},6000);

}

setInterval(createLine,80);

/* الكلمات */

const words = [

"كل سنة ❤️",

"و انتي طيبة ✨",

"يا احلي 🥹",

"و اجمل 💖",

"و ارق 🌸",

"منوشه ❤️",

"في الدنيا 🌍",

"بحبك 🫶",

"يا عسليه 🥹❤️"

];

const text =
document.getElementById("text");

let index = 0;

function showWord(){

if(index >= words.length){

return;

}

text.classList.remove("hide");

text.innerHTML = words[index];

setTimeout(()=>{

text.classList.add("show");

},100);

setTimeout(()=>{

text.classList.remove("show");

text.classList.add("hide");

},1800);

index++;

setTimeout(showWord,3000);

}

showWord();

</script>

</body>
</html>
